<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- LANTERN: Lantern's name and the kit's Encore page colour; no Inter font (the kit uses the system's);
       no autobrr icons -->
  <meta name="theme-color" content="#161617">
  <meta name="description" content="Lantern"/>
  <title>Lantern</title>
  <!-- <base href="{{.BaseUrl}}"> -->
  <style>
      @font-face {
          font-family: "Inter Var";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          font-feature-settings: "calt" 0;
          src: local("Inter Var"), local("Inter Variable"),
          local("Inter var"), local("Inter variable"),
          local("InterVar"), local("InterVariable"),
          local("Inter"),
          url("/Inter-Variable.woff2") format("woff2");
      }

      :root {
          /* LANTERN: the kit's fonts (kit-leptos' kit.css): the system's own */
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
      }
  </style>
  <script>
      window.APP = {};
      window.APP.baseUrl = "{{.BaseUrl}}";
      // LANTERN: the instance name the header shows (Lantern's app_name setting), put in by Lantern's server
      window.APP.instanceName = "{{.InstanceName}}";

      // Update the base tag dynamically
      const base = document.createElement('base');
      base.href = window.APP.baseUrl;
      document.head.appendChild(base);

      const browserPrefers = !(window.matchMedia !== undefined && window.matchMedia("(prefers-color-scheme: light)").matches);
      const {darkTheme = browserPrefers} = JSON.parse(localStorage.getItem("settings")) || {};
      document.documentElement.classList.toggle("dark", darkTheme);
      // LANTERN: the kit's tokens follow data-theme: none is Encore (dark mode), "light" the light theme
      if (!darkTheme) document.documentElement.dataset.theme = "light";
  </script>
</head>
<body class="bg-color">
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root" class="pattern h-screen"></div>
<div id="portal-root"></div>
<script type="module" src="./src/index.tsx"></script>
</body>
</html>
