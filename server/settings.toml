# The settings table: every server setting with its environment variable and default, and for the ones on the
# Settings pages, the words and the layout of their field (the kit's
# crates/kit-server-settings README lists every option). build.rs turns this file into settings_gen.rs through kit-server-settings: the `Keys` names,
# the `TABLE` of definitions the store reads, and `SCHEMA`, which GET /api/settings/schema answers with.
#
# [sections.<id>]  a page under Settings, in nav order: title.
# [groups.<id>]    a card on a page, in page order: section, title, desc.
# [keys.<name>]    one setting: env (the environment variable that sets it and locks it in the UI), default (its
#                  TOML type is the setting's type), secret, group (the card that shows it), label, help, type,
#                  options, when, unit, min, max, step, full, advanced.

[sections.general]
title = "General"

[groups.general]
section = "general"
title = "General"
desc = "Your server's name and how long people stay signed in."

[keys.app_name]
env = "APP_NAME"
default = "Lantern"
group = "general"
label = "App name"
type = "text"

[keys.session_days]
env = "APP_SESSION_DAYS"
default = 30
group = "general"
label = "Stay signed in for (days)"
type = "number"
unit = "days"
min = 1

[keys.api_key]
env = "APP_API_KEY"
default = ""
secret = true
help = "The API key apps use (Sonarr, Radarr, Prowlarr API clients) as `apikey` or `x-api-key`; made at the first start."
group = "apps"
label = "API key"
type = "password"

[keys.public_url]
env = "APP_PUBLIC_URL"
default = ""
group = "apps"
label = "Lantern's address for apps"
help = "The address apps reach Lantern at (http://lantern:9696). Empty: the address each app used."
type = "url"

[sections.indexers]
title = "Indexers"

[groups.apps]
section = "general"
title = "Apps"
desc = "How apps like Sonarr, Radarr and Lidarr reach Lantern."

[groups.definitions]
section = "indexers"
title = "Indexer definitions"
desc = "The site definitions Lantern searches with, from Prowlarr/Indexers."

[keys.definitions_auto_update]
env = "APP_DEFINITIONS_AUTO_UPDATE"
default = true
group = "definitions"
label = "Update the definitions every day"
type = "bool"

[keys.definitions_source]
env = "APP_DEFINITIONS_SOURCE"
default = ""
group = "definitions"
label = "Where updates come from"
help = "A .tar.gz of the Prowlarr/Indexers repository. Empty: GitHub."
type = "url"
advanced = true

[groups.network]
section = "indexers"
title = "Network"
desc = "How Lantern reaches the sites."

[keys.site_proxy]
env = "APP_SITE_PROXY"
default = ""
group = "network"
label = "Proxy for sites"
help = "An HTTP or SOCKS5 proxy for every indexer (socks5://host:1080). Empty: none."
type = "text"

[sections.downloads]
title = "Downloads"

[groups.downloads]
section = "downloads"
title = "Downloads"
desc = "Where downloads go and how hard Lantern tries. Each app gets a folder of its own inside the downloads folder."

[keys.downloads_root]
env = "APP_DOWNLOADS_DIR"
default = "/downloads"
group = "downloads"
label = "Downloads folder"
help = "Where Lantern sees the downloads folder. Mount the same folder in every app and download client (hardlinks need one file system)."
type = "text"

[keys.grab_attempts]
env = "APP_GRAB_ATTEMPTS"
default = 5
group = "downloads"
label = "Tries before a grab fails"
help = "How many times Lantern sends a grab to a download client before it tells the app it failed."
type = "number"
min = 1
max = 20

[sections.accounts]
title = "Accounts"

[groups.keeper]
section = "accounts"
title = "Account keeper"
desc = "How Lantern keeps your tracker accounts alive and how early it warns you."

[keys.keeper_warn_days]
env = "APP_KEEPER_WARN_DAYS"
default = 7
group = "keeper"
label = "Warn this many days ahead"
help = "Lantern warns when an account will break a site's rule within this many days."
type = "number"
unit = "days"
min = 1
max = 60

[keys.keeper_keepalive_days]
env = "APP_KEEPER_KEEPALIVE_DAYS"
default = 3
group = "keeper"
label = "Sign in to linked sites every"
help = "For accounts linked to an indexer, Lantern signs in on its own when it hasn't in this many days."
type = "number"
unit = "days"
min = 1
max = 60

[groups.alerts]
section = "accounts"
title = "Alerts"
desc = "Where Lantern sends a warning when an account is at risk, besides the banner. Leave a channel empty to skip it."

[keys.alert_ntfy_url]
env = "APP_ALERT_NTFY_URL"
default = ""
group = "alerts"
label = "ntfy topic"
help = "The full address of your ntfy topic, for example https://ntfy.sh/my-lantern."
type = "url"

[keys.alert_ntfy_token]
env = "APP_ALERT_NTFY_TOKEN"
default = ""
secret = true
group = "alerts"
label = "ntfy access token"
help = "Only for a topic that needs one."
type = "password"

[keys.alert_discord_webhook]
env = "APP_ALERT_DISCORD_WEBHOOK"
default = ""
secret = true
group = "alerts"
label = "Discord webhook"
help = "Channel settings → Integrations → Webhooks → Copy webhook URL."
type = "password"

[keys.alert_email_to]
env = "APP_ALERT_EMAIL_TO"
default = ""
group = "alerts"
label = "Email to"
help = "Where warning emails go. Needs the mail server below."
type = "text"

[keys.smtp_host]
env = "APP_SMTP_HOST"
default = ""
group = "alerts"
label = "Mail server"
help = "For example smtp.fastmail.com."
type = "text"

[keys.smtp_security]
env = "APP_SMTP_SECURITY"
default = "starttls"
group = "alerts"
label = "Security"
type = "select"
options = [["starttls", "STARTTLS (port 587)"], ["tls", "TLS (port 465)"], ["none", "None (local relay only)"]]

[keys.smtp_port]
env = "APP_SMTP_PORT"
default = 0
group = "alerts"
label = "Port"
help = "Empty or 0: 587 for STARTTLS, 465 for TLS, 25 without."
type = "number"
min = 0
max = 65535

[keys.smtp_user]
env = "APP_SMTP_USER"
default = ""
group = "alerts"
label = "Mail user"
type = "text"

[keys.smtp_password]
env = "APP_SMTP_PASSWORD"
default = ""
secret = true
group = "alerts"
label = "Mail password"
type = "password"

[keys.smtp_from]
env = "APP_SMTP_FROM"
default = ""
group = "alerts"
label = "From"
help = "The sender, for example Lantern <lantern@example.com>. Empty: the mail user."
type = "text"
[groups.seeding]
section = "downloads"
title = "Seeding and cleanup"
desc = "How long torrents keep sharing, and what happens once an app has imported a download."

[keys.seed_ratio]
env = "APP_SEED_RATIO"
default = 0.0
group = "seeding"
label = "Seed until this ratio"
help = "0: no ratio goal. A torrent has seeded enough at this ratio or after the hours below, whichever comes first."
type = "number"
min = 0
step = 0.1

[keys.seed_hours]
env = "APP_SEED_HOURS"
default = 0.0
group = "seeding"
label = "Or seed for (hours)"
help = "0: no time goal. With neither goal, a torrent has seeded enough when its client stops it."
type = "number"
unit = "hours"
min = 0

[keys.cleanup]
env = "APP_CLEANUP"
default = "off"
group = "seeding"
label = "After an app imported a download that has seeded enough"
type = "select"
options = [["off", "Keep it in the download client"], ["remove", "Remove it from the download client, keep the files"], ["delete", "Remove it and delete its files"]]

[groups.cross_seed]
section = "downloads"
title = "Cross-seed"
desc = "When a torrent has finished, Lantern looks for the same release on your other torrent sites. A copy with exactly the same files is added to the same download client, next to the files already there, so it seeds on both sites without downloading again."

[keys.cross_seed]
env = "APP_CROSS_SEED"
default = true
group = "cross_seed"
label = "Cross-seed finished torrents"
help = "Copies go into the app's category with .cross-seed after it, so the app doesn't import them twice."
type = "bool"

[keys.cross_seed_delay]
env = "APP_CROSS_SEED_DELAY"
default = 30
group = "cross_seed"
label = "Wait between searches"
help = "Seconds between two torrents' searches, so the sites aren't asked too often (cross-seed's delay: 30 to 3600)."
type = "number"
unit = "s"
min = 30
max = 3600

[keys.cross_seed_match_mode]
env = "APP_CROSS_SEED_MATCH_MODE"
default = "flexible"
group = "cross_seed"
label = "Match mode"
help = "How alike another site's copy must be. Strict: same file names and sizes. Flexible: same sizes, names may differ. Partial: like flexible, but small files such as .nfo or .srt may be missing. Copies that aren't strict matches are kept until their files can be linked."
type = "select"
options = [["strict", "Strict"], ["flexible", "Flexible"], ["partial", "Partial"]]

[keys.cross_seed_include_single_episodes]
env = "APP_CROSS_SEED_INCLUDE_SINGLE_EPISODES"
default = false
group = "cross_seed"
label = "Search single episodes"
help = "Also search torrents of one episode. Announces always match episodes."
type = "bool"

[keys.cross_seed_include_non_videos]
env = "APP_CROSS_SEED_INCLUDE_NON_VIDEOS"
default = false
group = "cross_seed"
label = "Search releases that are mostly not video"
help = "Music, books, games and the like. Off: a release is left out when its non-video files are more than the size tolerance of it."
type = "bool"

[keys.cross_seed_season_from_episodes]
env = "APP_CROSS_SEED_SEASON_FROM_EPISODES"
default = 1.0
group = "cross_seed"
label = "Season packs from episodes"
help = "The share of a season's episodes you must have to match its season pack (1: all of them). 0 turns it off. Below 1 needs the Partial match mode."
type = "number"
min = 0
max = 1
step = 0.05
advanced = true

[keys.cross_seed_fuzzy_size_threshold]
env = "APP_CROSS_SEED_FUZZY_SIZE_THRESHOLD"
default = 0.02
group = "cross_seed"
label = "Size tolerance"
help = "How far another site's listed size may be from yours before its torrent is fetched (0.02 is 2%). Change it only with good reason."
type = "number"
min = 0
max = 1
step = 0.01
advanced = true

[keys.cross_seed_exclude_older]
env = "APP_CROSS_SEED_EXCLUDE_OLDER"
default = "2 weeks"
group = "cross_seed"
label = "Stop searching after"
help = "Leave out torrents first searched longer ago than this, such as 2 weeks or 450 days. Empty: never stop. It must be 2 to 5 times the next setting."
type = "text"
advanced = true

[keys.cross_seed_exclude_recent_search]
env = "APP_CROSS_SEED_EXCLUDE_RECENT_SEARCH"
default = "3 days"
group = "cross_seed"
label = "Search again after"
help = "Leave out torrents searched more recently than this, such as 3 days or 90 days. Empty: search every time."
type = "text"
advanced = true

[keys.cross_seed_block_list]
env = "APP_CROSS_SEED_BLOCK_LIST"
default = ""
group = "cross_seed"
label = "Block list"
help = "Torrents never to cross-seed, one per line, each with its kind: name:, nameRegex:, folder:, folderRegex:, category:, tag:, tracker:, infoHash:, sizeBelow: or sizeAbove: (for example name:x265 or sizeBelow:100000000)."
type = "textarea"
advanced = true

[keys.cross_seed_ignore_titles]
env = "APP_CROSS_SEED_IGNORE_TITLES"
default = false
group = "cross_seed"
label = "Ignore titles when adding saved torrents"
help = "When kept torrents are added later, don't check that their names fit the files found."
type = "bool"
advanced = true

[keys.cross_seed_port]
env = "APP_CROSS_SEED_PORT"
default = 2468
group = "cross_seed"
label = "cross-seed API port"
help = "The port of the cross-seed API (webhook, announce, job, ping, status) for autobrr, Sonarr, Radarr and scripts, with Lantern's API key. 0 turns it off. A change takes effect after a restart."
type = "number"
min = 0
max = 65535
advanced = true

[groups.soulseek]
section = "downloads"
title = "Soulseek"
desc = "Music from Soulseek through slskd (a free Soulseek client). Music searches also search Soulseek; finished downloads are linked into the app's folder."

[keys.soulseek_url]
env = "APP_SOULSEEK_URL"
default = ""
group = "soulseek"
label = "slskd's address"
help = "Like http://slskd:5030. Empty: Soulseek is off."
type = "url"

[keys.soulseek_api_key]
env = "APP_SOULSEEK_API_KEY"
default = ""
secret = true
group = "soulseek"
label = "slskd's API key"
help = "One of the keys under web.authentication.api_keys in slskd's settings."
type = "password"

[keys.soulseek_downloads]
env = "APP_SOULSEEK_DOWNLOADS"
default = ""
group = "soulseek"
label = "slskd's downloads folder"
help = "Where Lantern sees slskd's downloads folder. Empty: soulseek inside the downloads folder. On the same file system as the downloads folder, files are hardlinked instead of copied."
type = "text"

[keys.soulseek_search_secs]
env = "APP_SOULSEEK_SEARCH_SECS"
default = 15
group = "soulseek"
label = "Search for (seconds)"
help = "How long Soulseek searches wait for answers from other users."
type = "number"
unit = "seconds"
min = 3
max = 60
