# The settings table: every server setting with its environment variable and default, and for the ones on the
# Settings pages, the words and the layout of their field (the kit's
# crates/kit-server-settings README lists every option). build.rs turns this file into settings_gen.rs through kit-server-settings: the `Keys` names,
# the `TABLE` of definitions the store reads, and `SCHEMA`, which GET /api/settings/schema answers with.
#
# [sections.<id>]  a page under Settings, in nav order: title.
# [groups.<id>]    a card on a page, in page order: section, title, desc.
# [keys.<name>]    one setting: env (the environment variable that sets it and locks it in the UI), default (its
#                  TOML type is the setting's type), secret, group (the card that shows it), label, help, type,
#                  options, when, unit, min, max, step, full, advanced.

[sections.general]
title = "General"

[groups.general]
section = "general"
title = "General"
desc = "Your server's name and how long people stay signed in."

[keys.app_name]
env = "APP_NAME"
default = "Lantern"
group = "general"
label = "App name"
type = "text"

[keys.session_days]
env = "APP_SESSION_DAYS"
default = 30
group = "general"
label = "Stay signed in for (days)"
type = "number"
unit = "days"
min = 1

[keys.api_key]
env = "APP_API_KEY"
default = ""
secret = true
help = "The API key apps use (Sonarr, Radarr, Prowlarr API clients) as `apikey` or `x-api-key`; made at the first start."
group = "apps"
label = "API key"
type = "password"

[keys.public_url]
env = "APP_PUBLIC_URL"
default = ""
group = "apps"
label = "Lantern's address for apps"
help = "The address apps reach Lantern at (http://lantern:9696). Empty: the address each app used."
type = "url"

[sections.indexers]
title = "Indexers"

[groups.apps]
section = "general"
title = "Apps"
desc = "How apps like Sonarr, Radarr and Lidarr reach Lantern."

[groups.definitions]
section = "indexers"
title = "Indexer definitions"
desc = "The site definitions Lantern searches with, from Prowlarr/Indexers."

[keys.definitions_auto_update]
env = "APP_DEFINITIONS_AUTO_UPDATE"
default = true
group = "definitions"
label = "Update the definitions every day"
type = "bool"

[keys.definitions_source]
env = "APP_DEFINITIONS_SOURCE"
default = ""
group = "definitions"
label = "Where updates come from"
help = "A .tar.gz of the Prowlarr/Indexers repository. Empty: GitHub."
type = "url"
advanced = true

[groups.network]
section = "indexers"
title = "Network"
desc = "How Lantern reaches the sites."

[keys.site_proxy]
env = "APP_SITE_PROXY"
default = ""
group = "network"
label = "Proxy for sites"
help = "An HTTP or SOCKS5 proxy for every indexer (socks5://host:1080). Empty: none."
type = "text"

[sections.downloads]
title = "Downloads"

[groups.downloads]
section = "downloads"
title = "Downloads"
desc = "Where downloads go and how hard Lantern tries. Each app gets a folder of its own inside the downloads folder."

[keys.downloads_root]
env = "APP_DOWNLOADS_DIR"
default = "/downloads"
group = "downloads"
label = "Downloads folder"
help = "Where Lantern sees the downloads folder. Mount the same folder in every app and download client (hardlinks need one file system)."
type = "text"

[keys.grab_attempts]
env = "APP_GRAB_ATTEMPTS"
default = 5
group = "downloads"
label = "Tries before a grab fails"
help = "How many times Lantern sends a grab to a download client before it tells the app it failed."
type = "number"
min = 1
max = 20

[sections.accounts]
title = "Accounts"

[groups.keeper]
section = "accounts"
title = "Account keeper"
desc = "How Lantern keeps your tracker accounts alive and how early it warns you."

[keys.keeper_warn_days]
env = "APP_KEEPER_WARN_DAYS"
default = 7
group = "keeper"
label = "Warn this many days ahead"
help = "Lantern warns when an account will break a site's rule within this many days."
type = "number"
unit = "days"
min = 1
max = 60

[keys.keeper_keepalive_days]
env = "APP_KEEPER_KEEPALIVE_DAYS"
default = 3
group = "keeper"
label = "Sign in to linked sites every"
help = "For accounts linked to an indexer, Lantern signs in on its own when it hasn't in this many days."
type = "number"
unit = "days"
min = 1
max = 60

[groups.alerts]
section = "accounts"
title = "Alerts"
desc = "Where Lantern sends a warning when an account is at risk, besides the banner. Leave a channel empty to skip it."

[keys.alert_ntfy_url]
env = "APP_ALERT_NTFY_URL"
default = ""
group = "alerts"
label = "ntfy topic"
help = "The full address of your ntfy topic, for example https://ntfy.sh/my-lantern."
type = "url"

[keys.alert_ntfy_token]
env = "APP_ALERT_NTFY_TOKEN"
default = ""
secret = true
group = "alerts"
label = "ntfy access token"
help = "Only for a topic that needs one."
type = "password"

[keys.alert_discord_webhook]
env = "APP_ALERT_DISCORD_WEBHOOK"
default = ""
secret = true
group = "alerts"
label = "Discord webhook"
help = "Channel settings → Integrations → Webhooks → Copy webhook URL."
type = "password"

[keys.alert_email_to]
env = "APP_ALERT_EMAIL_TO"
default = ""
group = "alerts"
label = "Email to"
help = "Where warning emails go. Needs the mail server below."
type = "text"

[keys.smtp_host]
env = "APP_SMTP_HOST"
default = ""
group = "alerts"
label = "Mail server"
help = "For example smtp.fastmail.com."
type = "text"

[keys.smtp_security]
env = "APP_SMTP_SECURITY"
default = "starttls"
group = "alerts"
label = "Security"
type = "select"
options = [["starttls", "STARTTLS (port 587)"], ["tls", "TLS (port 465)"], ["none", "None (local relay only)"]]

[keys.smtp_port]
env = "APP_SMTP_PORT"
default = 0
group = "alerts"
label = "Port"
help = "Empty or 0: 587 for STARTTLS, 465 for TLS, 25 without."
type = "number"
min = 0
max = 65535

[keys.smtp_user]
env = "APP_SMTP_USER"
default = ""
group = "alerts"
label = "Mail user"
type = "text"

[keys.smtp_password]
env = "APP_SMTP_PASSWORD"
default = ""
secret = true
group = "alerts"
label = "Mail password"
type = "password"

[keys.smtp_from]
env = "APP_SMTP_FROM"
default = ""
group = "alerts"
label = "From"
help = "The sender, for example Lantern <lantern@example.com>. Empty: the mail user."
type = "text"
[groups.seeding]
section = "downloads"
title = "Seeding and cleanup"
desc = "How long torrents keep sharing, and what happens once an app has imported a download."

[keys.seed_ratio]
env = "APP_SEED_RATIO"
default = 0.0
group = "seeding"
label = "Seed until this ratio"
help = "0: no ratio goal. A torrent has seeded enough at this ratio or after the hours below, whichever comes first."
type = "number"
min = 0
step = 0.1

[keys.seed_hours]
env = "APP_SEED_HOURS"
default = 0.0
group = "seeding"
label = "Or seed for (hours)"
help = "0: no time goal. With neither goal, a torrent has seeded enough when its client stops it."
type = "number"
unit = "hours"
min = 0

[keys.cleanup]
env = "APP_CLEANUP"
default = "off"
group = "seeding"
label = "After an app imported a download that has seeded enough"
type = "select"
options = [["off", "Keep it in the download client"], ["remove", "Remove it from the download client, keep the files"], ["delete", "Remove it and delete its files"]]

[groups.cross_seed]
section = "downloads"
title = "Cross-seed"
desc = "When a torrent has finished, Lantern looks for the same release on your other torrent sites. A copy with exactly the same files is added to the same download client, next to the files already there, so it seeds on both sites without downloading again."

[keys.cross_seed]
env = "APP_CROSS_SEED"
default = true
group = "cross_seed"
label = "Cross-seed finished torrents"
help = "Copies go into the same category as the torrent they match, tagged cross-seed. Turn on 'Own category for matches' if an app would import them twice."
type = "bool"

[keys.cross_seed_delay]
env = "APP_CROSS_SEED_DELAY"
default = 30
group = "cross_seed"
label = "Wait between searches"
help = "Seconds between two torrents' searches, so the sites aren't asked too often (cross-seed's delay: 30 to 3600)."
type = "number"
unit = "s"
min = 30
max = 3600

[keys.cross_seed_match_mode]
env = "APP_CROSS_SEED_MATCH_MODE"
default = "flexible"
group = "cross_seed"
label = "Match mode"
help = "How alike another site's copy must be. Strict: same file names and sizes. Flexible: same sizes, names may differ. Partial: like flexible, but small files such as .nfo or .srt may be missing. Copies that aren't strict matches are kept until their files can be linked."
type = "select"
options = [["strict", "Strict"], ["flexible", "Flexible"], ["partial", "Partial"]]

[keys.cross_seed_include_single_episodes]
env = "APP_CROSS_SEED_INCLUDE_SINGLE_EPISODES"
default = false
group = "cross_seed"
label = "Search single episodes"
help = "Also search torrents of one episode. Announces always match episodes."
type = "bool"

[keys.cross_seed_include_non_videos]
env = "APP_CROSS_SEED_INCLUDE_NON_VIDEOS"
default = false
group = "cross_seed"
label = "Search releases that are mostly not video"
help = "Music, books, games and the like. Off: a release is left out when its non-video files are more than the size tolerance of it."
type = "bool"

[keys.cross_seed_season_from_episodes]
env = "APP_CROSS_SEED_SEASON_FROM_EPISODES"
default = 1.0
group = "cross_seed"
label = "Season packs from episodes"
help = "The share of a season's episodes you must have to match its season pack (1: all of them). 0 turns it off. Below 1 needs the Partial match mode."
type = "number"
min = 0
max = 1
step = 0.05
advanced = true

[keys.cross_seed_fuzzy_size_threshold]
env = "APP_CROSS_SEED_FUZZY_SIZE_THRESHOLD"
default = 0.02
group = "cross_seed"
label = "Size tolerance"
help = "How far another site's listed size may be from yours before its torrent is fetched (0.02 is 2%). Change it only with good reason."
type = "number"
min = 0
max = 1
step = 0.01
advanced = true

[keys.cross_seed_exclude_older]
env = "APP_CROSS_SEED_EXCLUDE_OLDER"
default = "2 weeks"
group = "cross_seed"
label = "Stop searching after"
help = "Leave out torrents first searched longer ago than this, such as 2 weeks or 450 days. Empty: never stop. It must be 2 to 5 times the next setting."
type = "text"
advanced = true

[keys.cross_seed_exclude_recent_search]
env = "APP_CROSS_SEED_EXCLUDE_RECENT_SEARCH"
default = "3 days"
group = "cross_seed"
label = "Search again after"
help = "Leave out torrents searched more recently than this, such as 3 days or 90 days. Empty: search every time."
type = "text"
advanced = true

[keys.cross_seed_block_list]
env = "APP_CROSS_SEED_BLOCK_LIST"
default = ""
group = "cross_seed"
label = "Block list"
help = "Torrents never to cross-seed, one per line, each with its kind: name:, nameRegex:, folder:, folderRegex:, category:, tag:, tracker:, infoHash:, sizeBelow: or sizeAbove: (for example name:x265 or sizeBelow:100000000)."
type = "textarea"
advanced = true

[keys.cross_seed_ignore_titles]
env = "APP_CROSS_SEED_IGNORE_TITLES"
default = false
group = "cross_seed"
label = "Ignore titles when adding saved torrents"
help = "When kept torrents are added later, don't check that their names fit the files found."
type = "bool"
advanced = true

[keys.cross_seed_port]
env = "APP_CROSS_SEED_PORT"
default = 2468
group = "cross_seed"
label = "cross-seed API port"
help = "The port of the cross-seed API (webhook, announce, job, ping, status) for autobrr, Sonarr, Radarr and scripts, with Lantern's API key. 0 turns it off. A change takes effect after a restart."
type = "number"
min = 0
max = 65535
advanced = true

[keys.cross_seed_action]
env = "APP_CROSS_SEED_ACTION"
default = "inject"
group = "cross_seed"
label = "What to do with a match"
help = "Add it to the download client, or only save its .torrent file in the cross-seeds folder of the data folder to add by hand."
type = "select"
options = [["inject", "Add it to the download client"], ["save", "Only save the .torrent file"]]

[keys.cross_seed_link_dirs]
env = "APP_CROSS_SEED_LINK_DIRS"
default = ""
group = "cross_seed"
label = "Link folders"
help = "Folders where a match's files are linked from the files you have, one per line, each on the same drive as some of your downloads (cross-seed's linkDirs). Needed for the Flexible and Partial match modes and for season packs from episodes."
type = "textarea"

[keys.cross_seed_link_type]
env = "APP_CROSS_SEED_LINK_TYPE"
default = "hardlink"
group = "cross_seed"
label = "Link type"
help = "How files are linked. Hardlink and reflink need the same drive; reflink also needs a file system that has it (btrfs, XFS). Reflink or copy copies the file where a reflink can't be made."
type = "select"
options = [["hardlink", "Hardlink"], ["symlink", "Symlink"], ["reflink", "Reflink"], ["reflinkOrCopy", "Reflink or copy"]]
advanced = true

[keys.cross_seed_flat_linking]
env = "APP_CROSS_SEED_FLAT_LINKING"
default = false
group = "cross_seed"
label = "Link straight into the link folder"
help = "Off: each site's matches are linked in a folder named after the site, inside the link folder. On: all in the link folder itself."
type = "bool"
advanced = true

[keys.cross_seed_link_category]
env = "APP_CROSS_SEED_LINK_CATEGORY"
default = "cross-seed-link"
group = "cross_seed"
label = "Category of linked matches"
help = "The download client category (qBittorrent) or label (Deluge) of matches added from linked files. Empty: none."
type = "text"
advanced = true

[keys.cross_seed_duplicate_categories]
env = "APP_CROSS_SEED_DUPLICATE_CATEGORIES"
default = false
group = "cross_seed"
label = "Own category for matches"
help = "Add matches under the torrent's category with .cross-seed after it, instead of the same category."
type = "bool"
advanced = true

[keys.cross_seed_skip_recheck]
env = "APP_CROSS_SEED_SKIP_RECHECK"
default = true
group = "cross_seed"
label = "Skip the check of matched files"
help = "Matches with every file are added without the client checking them first. Partial matches and disc images are always checked."
type = "bool"
advanced = true

[keys.cross_seed_auto_resume_max_download]
env = "APP_CROSS_SEED_AUTO_RESUME_MAX_DOWNLOAD"
default = 52428800
group = "cross_seed"
label = "Start partial matches missing up to"
help = "After its check, a partial match missing at most this many bytes is started; a bigger one stays paused (0 to 52428800, which is 50 MiB)."
type = "number"
unit = "bytes"
min = 0
max = 52428800
advanced = true

[keys.cross_seed_ignore_non_relevant_files_to_resume]
env = "APP_CROSS_SEED_IGNORE_NON_RELEVANT_FILES_TO_RESUME"
default = false
group = "cross_seed"
label = "Start partial matches missing only extras"
help = "Also start a partial match whose missing part is only samples, trailers, extras, .nfo, .srt and the like, up to 200 MiB."
type = "bool"
advanced = true

[keys.cross_seed_torrent_clients]
env = "APP_CROSS_SEED_TORRENT_CLIENTS"
default = ""
secret = true
group = "cross_seed"
label = "Torrent clients"
help = "Empty: Lantern's torrent download clients. Otherwise one per line as cross-seed writes them, such as qbittorrent:http://user:password@qbittorrent:8080 or rtorrent:readonly:http://rtorrent/RPC2. A readonly client is searched but nothing is added to it."
type = "textarea"
advanced = true

[keys.cross_seed_use_client_torrents]
env = "APP_CROSS_SEED_USE_CLIENT_TORRENTS"
default = true
group = "cross_seed"
label = "Search the torrents in the clients"
help = "Search for every torrent in the torrent clients (cross-seed's useClientTorrents). Turn it off to search only a torrent folder or data folders."
type = "bool"
advanced = true

[keys.cross_seed_torrent_dir]
env = "APP_CROSS_SEED_TORRENT_DIR"
default = ""
group = "cross_seed"
label = "Torrent folder"
help = "A folder of .torrent files to search for instead of the clients' torrents, such as qBittorrent's BT_backup (cross-seed's torrentDir). Empty: none. It can't be used with 'Search the torrents in the clients'."
type = "text"
advanced = true

[keys.cross_seed_data_dirs]
env = "APP_CROSS_SEED_DATA_DIRS"
default = ""
group = "cross_seed"
label = "Data folders"
help = "Folders of downloaded files to search for, one per line (cross-seed's dataDirs). Lantern only reads them; matches are linked into the link folders."
type = "textarea"
advanced = true

[keys.cross_seed_max_data_depth]
env = "APP_CROSS_SEED_MAX_DATA_DEPTH"
default = 2
group = "cross_seed"
label = "Data folder depth"
help = "How many folder levels down the data folders are looked through for releases (cross-seed's maxDataDepth, usually 1 to 3)."
type = "number"
min = 1
max = 10
advanced = true

[keys.cross_seed_rss_cadence]
env = "APP_CROSS_SEED_RSS_CADENCE"
default = "30 minutes"
group = "cross_seed"
label = "Check new releases every"
help = "How often the newest releases of every indexer are compared with what you have, such as 30 minutes (cross-seed's rssCadence, 10 to 120 minutes). Empty: never."
type = "text"
advanced = true

[keys.cross_seed_search_cadence]
env = "APP_CROSS_SEED_SEARCH_CADENCE"
default = "1 day"
group = "cross_seed"
label = "Search everything every"
help = "How often everything you have is searched on the indexers, such as 1 day (cross-seed's searchCadence, at least 1 day). Empty: never."
type = "text"
advanced = true

[keys.cross_seed_search_limit]
env = "APP_CROSS_SEED_SEARCH_LIMIT"
default = 400
group = "cross_seed"
label = "Searches per indexer each time"
help = "The most searches each indexer gets in one run of the search (cross-seed's searchLimit). 0: no limit."
type = "number"
min = 0
advanced = true

[keys.cross_seed_snatch_timeout]
env = "APP_CROSS_SEED_SNATCH_TIMEOUT"
default = "30 seconds"
group = "cross_seed"
label = "Wait for a .torrent file up to"
help = "How long a site may take to send a .torrent file (cross-seed's snatchTimeout). Empty: no limit."
type = "text"
advanced = true

[keys.cross_seed_search_timeout]
env = "APP_CROSS_SEED_SEARCH_TIMEOUT"
default = "2 minutes"
group = "cross_seed"
label = "Wait for a search up to"
help = "How long an indexer may take to answer a search (cross-seed's searchTimeout). Empty: no limit."
type = "text"
advanced = true

[keys.cross_seed_notification_webhook_urls]
env = "APP_CROSS_SEED_NOTIFICATION_WEBHOOK_URLS"
default = ""
secret = true
group = "cross_seed"
label = "Notification addresses"
help = "Addresses that get cross-seed's JSON message after each match is added or saved, or fails, one per line (cross-seed's notificationWebhookUrls), such as an Apprise or Notifiarr address."
type = "textarea"
advanced = true

[keys.cross_seed_sonarr]
env = "APP_CROSS_SEED_SONARR"
default = ""
secret = true
group = "cross_seed"
label = "Sonarr addresses"
help = "Sonarr addresses with their API key, one per line, such as http://sonarr:8989/?apikey=KEY (cross-seed's sonarr). Shows and episodes are then searched by their ids, which finds more."
type = "textarea"
advanced = true

[keys.cross_seed_radarr]
env = "APP_CROSS_SEED_RADARR"
default = ""
secret = true
group = "cross_seed"
label = "Radarr addresses"
help = "Radarr addresses with their API key, one per line, such as http://radarr:7878/?apikey=KEY (cross-seed's radarr). Movies are then searched by their ids."
type = "textarea"
advanced = true

[groups.soulseek]
section = "downloads"
title = "Soulseek"
desc = "Music from Soulseek through slskd (a free Soulseek client). Music searches also search Soulseek; finished downloads are linked into the app's folder."

[keys.soulseek_url]
env = "APP_SOULSEEK_URL"
default = ""
group = "soulseek"
label = "slskd's address"
help = "Like http://slskd:5030. Empty: Soulseek is off."
type = "url"

[keys.soulseek_api_key]
env = "APP_SOULSEEK_API_KEY"
default = ""
secret = true
group = "soulseek"
label = "slskd's API key"
help = "One of the keys under web.authentication.api_keys in slskd's settings."
type = "password"

[keys.soulseek_downloads]
env = "APP_SOULSEEK_DOWNLOADS"
default = ""
group = "soulseek"
label = "slskd's downloads folder"
help = "Where Lantern sees slskd's downloads folder. Empty: soulseek inside the downloads folder. On the same file system as the downloads folder, files are hardlinked instead of copied."
type = "text"

[keys.soulseek_search_secs]
env = "APP_SOULSEEK_SEARCH_SECS"
default = 15
group = "soulseek"
label = "Search for (seconds)"
help = "How long Soulseek searches wait for answers from other users."
type = "number"
unit = "seconds"
min = 3
max = 60
