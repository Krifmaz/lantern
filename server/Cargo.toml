# Lantern's server: the API and the web app (web/, built by trunk) served by one binary.
# A Cargo workspace of its own, like web/ and desktop/.
[workspace]
resolver = "2"

[package]
name = "lantern"
description = "Lantern's server: the API and the web app, one binary."
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Krifmaz/lantern"
publish = false

# the library is `server` in every app, so the Rust files need no app name (the binary keeps the package name)
[lib]
name = "server"
path = "src/lib.rs"

# The kit, pinned to one release tag. To update: read the kit's CHANGELOG.md, bump the tag here and in
# web/Cargo.toml, run the tests.
[dependencies]
kit-server-core = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0", features = ["sqlite"] }
kit-server-health = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0" }
kit-server-changelog = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0" }
kit-server-notices = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0" }
kit-server-bugreports = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0" }
kit-server-diagnostics = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0" }
kit-server-setup = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0" }
kit-server-settings = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0" }
kit-server-updates = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0" }
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
cookie = "0.18"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.17"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# indexers: definitions, sites, Torznab
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
dom_query = "0.29"
regex = "1"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2"
percent-encoding = "2"
html-escape = "0.2"
unicode-normalization = "0.1"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "multipart", "json", "gzip", "brotli", "deflate", "socks"] }
quick-xml = "0.37"
futures-util = "0.3"
hmac = "0.12"
chromiumoxide = { version = "0.9", default-features = false }
tar = "0.4"
flate2 = "1"
# account vault: argon2id keys, XChaCha20-Poly1305, wiped secrets, TOTP codes
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
sha1 = "0.10"
# account keeper: warning emails
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
# migration: Prowlarr backups are zip files
zip = { version = "2", default-features = false, features = ["deflate"] }
# releases: IRC announces over TLS
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
# releases: autobrr's release hash (md5 of the normalized name)
md-5 = "0.10"

[build-dependencies]
kit-server-settings = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0", default-features = false, features = ["toml"] }
kit-server-changelog = { git = "https://github.com/Krifmaz/kit", tag = "v0.8.0", default-features = false }

# cross-seed: reflinks (FICLONE)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
missing_docs = "warn"

# argon2 is slow unoptimised: tests and debug builds derive keys at release speed
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
