org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The app's version comes from the release workflow (the kit's kit-android.yml):
#   -PappVersionName=<x.y.z> -PappVersionCode=<code>; without them a local build is 0.0.1-dev (1).
# The server the app suggests on first start: -PappServerUrl=<url> (default http://10.0.2.2:9696, the computer
# running the emulator).
# Sign-in for the kit's GitHub Packages: gpr.user and gpr.key go in ~/.gradle/gradle.properties, never here.
# The kit from source: -PkitPath=<kit checkout> (see settings.gradle.kts).
