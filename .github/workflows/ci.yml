name: ci

# Every pull request: the kit's checks (fmt, clippy -D warnings, tests of server/, desktop/ and web/), the Docker image
# built (not pushed), the image's browser getting past a Cloudflare-style check, the Android app built and unit-tested,
# and real Sonarr, Radarr, Lidarr and Readarr adding Lantern as an indexer. Required to pass before a merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: Krifmaz/kit/.github/workflows/kit-ci.yml@v0.8.0
    with:
      rust-dirs: |
        server
        desktop
      wasm-dirs: web

  docker:
    needs: test
    uses: Krifmaz/kit/.github/workflows/kit-docker.yml@v0.8.0
    with:
      image: lantern
      push: false
      platforms: linux/amd64

  android:
    needs: test
    uses: Krifmaz/kit/.github/workflows/kit-android.yml@v0.8.0
    with:
      app-name: Lantern
      project-dir: android
      baseline-profile: true

  # Real Sonarr, Radarr, Lidarr and Readarr add Lantern as a Torznab indexer and as their qBittorrent, SABnzbd and
  # NZBGet (scripts/contract-arrs.sh)
  contract:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build Lantern and the test tracker
        run: cd server && cargo build --release --locked && cargo build --release --locked --example mock_tracker
      - name: Sonarr, Radarr, Lidarr and Readarr add Lantern
        run: bash scripts/contract-arrs.sh

  # The image as it ships gets past a Cloudflare-style check with its own browser (scripts/image-solver.sh)
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build the test site
        run: cd server && cargo build --release --locked --example mock_challenge
      - name: Build the image
        run: docker build -t lantern:ci .
      - name: The image's browser gets past a check
        run: bash scripts/image-solver.sh
